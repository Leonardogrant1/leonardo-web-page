<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Dummy-Hintergrund: später durch echtes Foto (background.jpg) ersetzen -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#1b2735"/>
  <g filter="url(#blur)">
    <circle cx="300" cy="200" r="360" fill="#4a6fa5"/>
    <circle cx="1250" cy="150" r="320" fill="#8e5aa8"/>
    <circle cx="800" cy="550" r="400" fill="#2e4a66"/>
    <circle cx="1450" cy="650" r="300" fill="#c96f4a"/>
    <circle cx="150" cy="750" r="280" fill="#3a7d6b"/>
  </g>
</svg>
